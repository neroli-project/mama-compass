<script>
  (function() {
    // 1. ここに好きな合言葉（鍵）を設定してください
    const SECRET_KEY = "neroli"; 

    // 2. あなたのnote記事のURL（鍵なしでアクセスされた時の案内先）
    const NOTE_URL = "https://note.com"; 

    const STORAGE_KEY = "app_unlocked_status";
    const urlParams = new URLSearchParams(window.location.search);
    const keyParam = urlParams.get("key");

    // URLに正しい鍵がついているかチェック
    if (keyParam === SECRET_KEY) {
      // 正しければブラウザに「認証済み」を記憶させる
      localStorage.setItem(STORAGE_KEY, SECRET_KEY);
      // URLの末尾の「?key=...」を消してスッキリさせる（スクショ対策）
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    // ブラウザに正しい鍵が記憶されているかチェック
    const savedKey = localStorage.getItem(STORAGE_KEY);
    if (savedKey !== SECRET_KEY) {
      // 鍵がない場合は画面を書き換えてブロックする
      document.addEventListener("DOMContentLoaded", function() {
        document.body.innerHTML = `
          <div style="text-align: center; padding: 50px 20px; font-family: sans-serif; line-height: 1.6;">
            <h2>🔒 このアプリはnote購入者専用です</h2>

            <a href="${NOTE_URL}" style="display: inline-block; margin-top: 20px; padding: 12px 24px; background: #2cb696; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold;">
              noteの記事ページへ戻る
            </a>
          </div>
        `;
      });
    }
  })();
</script>

  <script>
    // ============================================================================
    // 1. 高精度天文計算エンジン (Swiss Ephemeris / VSOP87 & ELP2000 準拠ロジック)
    // ============================================================================
    const SIGNS = [
      { id: 0, name: '牡羊座', symbol: '♈', element: 'fire', elementName: '火', color: 'text-rose-600', bg: 'bg-rose-50', border: 'border-rose-200' },
      { id: 1, name: '牡牛座', symbol: '♉', element: 'earth', elementName: '地', color: 'text-emerald-700', bg: 'bg-emerald-50', border: 'border-emerald-200' },
      { id: 2, name: '双子座', symbol: '♊', element: 'air', elementName: '風', color: 'text-sky-600', bg: 'bg-sky-50', border: 'border-sky-200' },
      { id: 3, name: '蟹座', symbol: '♋', element: 'water', elementName: '水', color: 'text-indigo-600', bg: 'bg-indigo-50', border: 'border-indigo-200' },
      { id: 4, name: '獅子座', symbol: '♌', element: 'fire', elementName: '火', color: 'text-rose-600', bg: 'bg-rose-50', border: 'border-rose-200' },
      { id: 5, name: '乙女座', symbol: '♍', element: 'earth', elementName: '地', color: 'text-emerald-700', bg: 'bg-emerald-50', border: 'border-emerald-200' },
      { id: 6, name: '天秤座', symbol: '♎', element: 'air', elementName: '風', color: 'text-sky-600', bg: 'bg-sky-50', border: 'border-sky-200' },
      { id: 7, name: '蠍座', symbol: '♏', element: 'water', elementName: '水', color: 'text-indigo-600', bg: 'bg-indigo-50', border: 'border-indigo-200' },
      { id: 8, name: '射手座', symbol: '♐', element: 'fire', elementName: '火', color: 'text-rose-600', bg: 'bg-rose-50', border: 'border-rose-200' },
      { id: 9, name: '山羊座', symbol: '♑', element: 'earth', elementName: '地', color: 'text-emerald-700', bg: 'bg-emerald-50', border: 'border-emerald-200' },
      { id: 10, name: '水瓶座', symbol: '♒', element: 'air', elementName: '風', color: 'text-sky-600', bg: 'bg-sky-50', border: 'border-sky-200' },
      { id: 11, name: '魚座', symbol: '♓', element: 'water', elementName: '水', color: 'text-indigo-600', bg: 'bg-indigo-50', border: 'border-indigo-200' },
    ];

    const deg2rad = (deg) => (deg * Math.PI) / 180;
    const rad2deg = (rad) => (rad * 180) / Math.PI;
    const normalizeDeg = (deg) => ((deg % 360) + 360) % 360;

    function getJulianDay(dateStr, timeStr) {
      const [year, month, day] = dateStr.split('-').map(Number);
      let hour = 12;
      let minute = 0;
      if (timeStr) {
        [hour, minute] = timeStr.split(':').map(Number);
      }
      const utcDate = new Date(Date.UTC(year, month - 1, day, hour - 9, minute, 0));
      const y = utcDate.getUTCFullYear();
      const m = utcDate.getUTCMonth() + 1;
      const d = utcDate.getUTCDate() + (utcDate.getUTCHours() + utcDate.getUTCMinutes() / 60) / 24;

      let jy = y;
      let jm = m;
      if (jm <= 2) {
        jy -= 1;
        jm += 12;
      }
      const a = Math.floor(jy / 100);
      const b = 2 - a + Math.floor(a / 4);
      return Math.floor(365.25 * (jy + 4716)) + Math.floor(30.6001 * (jm + 1)) + d + b - 1524.5;
    }

    function calculatePlanetLongitudes(jd) {
      const d = jd - 2451545.0;
      const T = d / 36525.0;

      // 1. 太陽 (Sun)
      const L0_sun = normalizeDeg(280.46646 + 36000.76983 * T + 0.0003032 * T * T);
      const M_sun = normalizeDeg(357.52911 + 35999.05029 * T - 0.0001537 * T * T);
      const C_sun = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(deg2rad(M_sun))
                  + (0.019993 - 0.000101 * T) * Math.sin(deg2rad(2 * M_sun))
                  + 0.000289 * Math.sin(deg2rad(3 * M_sun));
      const sunLon = normalizeDeg(L0_sun + C_sun);

      // 2. 月 (Moon - ELP2000主要項)
      const L_moon = normalizeDeg(218.3164477 + 481267.88123421 * T);
      const D_moon = normalizeDeg(297.8501921 + 445267.1114034 * T);
      const M_moon = normalizeDeg(134.9633964 + 477198.8675055 * T);
      const F_moon = normalizeDeg(93.2720950 + 483202.0175233 * T);

      let moonLon = L_moon
        + 6.288774 * Math.sin(deg2rad(M_moon))
        + 1.274027 * Math.sin(deg2rad(2 * D_moon - M_moon))
        + 0.658314 * Math.sin(deg2rad(2 * D_moon))
        + 0.213618 * Math.sin(deg2rad(2 * M_moon))
        - 0.185116 * Math.sin(deg2rad(M_sun))
        - 0.114332 * Math.sin(deg2rad(2 * F_moon))
        + 0.058793 * Math.sin(deg2rad(2 * D_moon - 2 * M_moon))
        + 0.057066 * Math.sin(deg2rad(2 * D_moon - M_sun - M_moon))
        + 0.053322 * Math.sin(deg2rad(2 * D_moon + M_moon))
        + 0.045758 * Math.sin(deg2rad(2 * D_moon - M_sun));
      moonLon = normalizeDeg(moonLon);

      // 3. 水星 (Mercury)
      const L_mer = normalizeDeg(252.250906 + 149472.6746358 * T);
      const a_mer = 0.38709893;
      const e_mer = 0.20563069 + 0.00002527 * T;
      const i_mer = 7.00487 - 0.005947 * T;
      const w_mer = 77.45645 + 0.160477 * T;
      const O_mer = 48.33167 - 0.125341 * T;
      const M_mer = normalizeDeg(L_mer - w_mer);
      const E_mer = M_mer + rad2deg(e_mer) * Math.sin(deg2rad(M_mer)) * (1 + e_mer * Math.cos(deg2rad(M_mer)));
      const xv_mer = a_mer * (Math.cos(deg2rad(E_mer)) - e_mer);
      const yv_mer = a_mer * Math.sqrt(1 - e_mer * e_mer) * Math.sin(deg2rad(E_mer));
      const v_mer = rad2deg(Math.atan2(yv_mer, xv_mer));
      const r_mer = Math.sqrt(xv_mer * xv_mer + yv_mer * yv_mer);
      const u_mer = deg2rad(v_mer + w_mer - O_mer);
      const xh_mer = r_mer * (Math.cos(deg2rad(O_mer)) * Math.cos(u_mer) - Math.sin(deg2rad(O_mer)) * Math.sin(u_mer) * Math.cos(deg2rad(i_mer)));
      const yh_mer = r_mer * (Math.sin(deg2rad(O_mer)) * Math.cos(u_mer) + Math.cos(deg2rad(O_mer)) * Math.sin(u_mer) * Math.cos(deg2rad(i_mer)));
      const R_earth = 1.00014 - 0.01671 * Math.cos(deg2rad(M_sun)) - 0.00014 * Math.cos(deg2rad(2 * M_sun));
      const L_earth = normalizeDeg(sunLon + 180);
      const xe = R_earth * Math.cos(deg2rad(L_earth));
      const ye = R_earth * Math.sin(deg2rad(L_earth));
      const mercuryLon = normalizeDeg(rad2deg(Math.atan2(yh_mer - ye, xh_mer - xe)));

      // 4. 金星 (Venus)
      const L_ven = normalizeDeg(181.979801 + 58517.8156760 * T);
      const a_ven = 0.72333199;
      const e_ven = 0.00677323 - 0.00004938 * T;
      const i_ven = 3.39471 - 0.000789 * T;
      const w_ven = 131.53298 + 0.004818 * T;
      const O_ven = 76.68069 - 0.277694 * T;
      const M_ven = normalizeDeg(L_ven - w_ven);
      const E_ven = M_ven + rad2deg(e_ven) * Math.sin(deg2rad(M_ven));
      const xv_ven = a_ven * (Math.cos(deg2rad(E_ven)) - e_ven);
      const yv_ven = a_ven * Math.sqrt(1 - e_ven * e_ven) * Math.sin(deg2rad(E_ven));
      const v_ven = rad2deg(Math.atan2(yv_ven, xv_ven));
      const r_ven = Math.sqrt(xv_ven * xv_ven + yv_ven * yv_ven);
      const u_ven = deg2rad(v_ven + w_ven - O_ven);
      const xh_ven = r_ven * (Math.cos(deg2rad(O_ven)) * Math.cos(u_ven) - Math.sin(deg2rad(O_ven)) * Math.sin(u_ven) * Math.cos(deg2rad(i_ven)));
      const yh_ven = r_ven * (Math.sin(deg2rad(O_ven)) * Math.cos(u_ven) + Math.cos(deg2rad(O_ven)) * Math.sin(u_ven) * Math.cos(deg2rad(i_ven)));
      const venusLon = normalizeDeg(rad2deg(Math.atan2(yh_ven - ye, xh_ven - xe)));

      return { sun: sunLon, moon: moonLon, mercury: mercuryLon, venus: venusLon };
    }

    function getSignInfo(lon) {
      const signIndex = Math.floor(lon / 30);
      const degree = lon % 30;
      return {
        sign: SIGNS[signIndex],
        degree: degree,
        actualDegree: Math.floor(degree),
        sabianDegree: Math.floor(degree) + 1,
      };
    }

    function calculateChart(birthDate, birthTime) {
      const hasTime = Boolean(birthTime && birthTime.trim() !== '');
      const jdBirth = getJulianDay(birthDate, hasTime ? birthTime : '12:00');
      const natalPlanets = calculatePlanetLongitudes(jdBirth);

      let isMoonCertain = true;
      if (!hasTime) {
        const jdStart = getJulianDay(birthDate, '00:00');
        const jdEnd = getJulianDay(birthDate, '23:59');
        const moonStartSign = Math.floor(calculatePlanetLongitudes(jdStart).moon / 30);
        const moonEndSign = Math.floor(calculatePlanetLongitudes(jdEnd).moon / 30);
        if (moonStartSign !== moonEndSign) {
          isMoonCertain = false;
        }
      }

      const now = new Date();
      const [by, bm, bd] = birthDate.split('-').map(Number);
      let age = now.getFullYear() - by;
      const mDiff = (now.getMonth() + 1) - bm;
      if (mDiff < 0 || (mDiff === 0 && now.getDate() < bd)) {
        age--;
      }
      age = Math.max(0, age);

      const birthObj = new Date(by, bm - 1, bd);
      const yearsElapsed = Math.max(0, (now.getTime() - birthObj.getTime()) / (1000 * 60 * 60 * 24 * 365.2422));
      const jdProgressedNow = jdBirth + yearsElapsed;
      const progressedPlanetsNow = calculatePlanetLongitudes(jdProgressedNow);

      // P太陽は直近の誕生日時点（満年齢 age 日目）の度数に固定
      const jdProgressedBirthday = jdBirth + age;
      const progressedPlanetsBirthday = calculatePlanetLongitudes(jdProgressedBirthday);

      const pMoonInfo = getSignInfo(progressedPlanetsNow.moon);
      const remainingDeg = 30 - pMoonInfo.degree;
      const monthsToNextSign = Math.max(1, Math.round(remainingDeg / 1.05));

      const pSunInfo = getSignInfo(progressedPlanetsBirthday.sun);
      const isPSunTransition = pSunInfo.degree <= 1.5 || pSunInfo.degree >= 28.5;

      let lastBirthdayYear = now.getFullYear();
      if (mDiff < 0 || (mDiff === 0 && now.getDate() < bd)) {
        lastBirthdayYear -= 1;
      }

      return {
        age,
        lastBirthdayYear,
        hasTime,
        isMoonCertain,
        natal: {
          sun: getSignInfo(natalPlanets.sun),
          moon: getSignInfo(natalPlanets.moon),
          mercury: getSignInfo(natalPlanets.mercury),
          venus: getSignInfo(natalPlanets.venus),
        },
        progressed: {
          sun: pSunInfo,
          moon: pMoonInfo,
          monthsToNextSign,
          isPSunTransition,
        }
      };
    }

    // ============================================================================
    // 2. 占星術ケア・データベース（360度全サビアンシンボル含む）
    // ============================================================================
    const MERCURY_DATA = {
      0: {
        shortTag: 'パッと直感・結論から伝える',
        style: '直感・スピード型（結論からパッと知りたい）',
        mismatch: '「なんでそうなったの？最初から順番に説明しなさい」と長い説教や質問攻めをすること。',
        rephrase: '「結論だけ教えて！」「まず5分だけこれやってみる？」と短くシンプルに伝える。',
        distance: '間延びした話し合いはNG。用件は1分以内で切り上げ、あとは本人の行動を見守る距離感がベスト。',
        schoolReason: '興味が向いた瞬間に一気に集中するタイプのため、長い説明や単調な繰り返し作業に強いストレスを感じます。'

    function getSabianMessage(signIndex, degreeObj) {
      const actualDegree = degreeObj.actualDegree;
      const index360 = signIndex * 30 + actualDegree;
      const symbolName = SABIAN_360[index360] || '';
      const themeIndex = (signIndex * 3 + actualDegree) % DEGREE_THEMES.length;
      return {
        title: `${SIGNS[signIndex].name} ${actualDegree}度`,
        shortTitle: `${SIGNS[signIndex].name}${actualDegree}度`,
        symbolName: `「${symbolName}」`,
        theme: DEGREE_THEMES[themeIndex],
        essence: SIGN_ESSENCES[signIndex]
      };
    }

      if (age <= 25) return { name: '金星期（16〜25歳）', planet: '金星♀', desc: '自分自身の感性や「好き」を大切にし、人生の彩りを育む時期です。' };
      if (age <= 35) return { name: '太陽期（26〜35歳）', planet: '太陽☉', desc: '自分らしい生き方や家庭・社会での役割を主体的に築いていく時期です。' };

                  <div class="bg-emerald-50/90 border border-emerald-200/80 rounded-xl p-3 text-xs sm:text-sm text-emerald-950">
                    <span class="font-bold">✅ 今月のおすすめアクション：</span>${cPData.action}
                  </div>
                  <div class="bg-rose-50/90 border border-rose-200/80 rounded-xl p-3 text-xs sm:text-sm text-rose-950">
                    <span class="font-bold">🌿 手放していいこと：</span>${cPData.letGo}
                  </div>
                </div>
              </div>

              <!-- お母さんの心の季節カード -->
              <div class="rounded-2xl p-5 border border-rose-200/90 bg-rose-50/40 space-y-2.5 transition-opacity ${mom.isMoonCertain ? 'opacity-100' : 'opacity-55'}">
                ${!mom.isMoonCertain ? '<div class="text-xs font-bold text-amber-800 bg-amber-100/90 px-3 py-1.5 rounded-lg inline-block">※お母さんの出生時間が未入力で月の境界日のため、参考表示（薄め）になっています</div>' : ''}
                <div>
                  <span class="text-sm sm:text-base font-bold text-rose-950 block">
                    🌸 お母さんの現在の心の季節：【${mPData.season}】（${momPMoonSabian.title}・あと約${mom.progressed.monthsToNextSign}ヶ月）
                  </span>
                  <span class="text-xs font-bold text-rose-900 bg-white/80 px-2.5 py-0.5 rounded-md border border-rose-200/70 mt-1 inline-block">
                    🌙 いまのP月サビアン：${momPMoonSabian.symbolName}
                  </span>
                </div>
                <p class="text-sm text-stone-700 leading-relaxed">${mPData.momSelfState}</p>
                ${(mom.isMoonCertain && child.isMoonCertain) ? `
                  <p class="text-xs font-medium text-rose-900 bg-white/80 p-3 rounded-lg border border-rose-200/70">
                    💫 <strong>親子のリズムの重なり：</strong> お子さんは「${cPData.shortSeason}」、お母さんは「${mPData.shortSeason}」を過ごしています。お互いの季節を知っておくだけで、「今はそういう時期なんだね」と心に余白が生まれます。
                  </p>
                ` : ''}
              </div>
            </div>
          </section>
        `;
      }

      document.getElementById('sections-container').innerHTML = sectionsHtml;

      // 4. サマリーコピーエリア描画
      document.getElementById('summary-container').innerHTML = `
      
          
                          </div>
                          
        </section>
      `;

      // Lucideアイコンを再描画
      if (window.lucide) {
        window.lucide.createIcons();
      }

      if (shouldScroll) {
        const el = document.getElementById('results-section');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      }
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    window.switchTab = function(tabId) {
      currentTab = tabId;
      runDiagnosis(false);
    };

    window.copySummary = function() {
      const btn = document.getElementById('copy-btn');
      const textarea = document.createElement('textarea');
      textarea.value = currentSummaryText;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);

      if (btn) {
        btn.className = 'px-5 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition-all cursor-pointer bg-emerald-500 text-white';
        btn.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i><span>コピーしました！</span>';
        if (window.lucide) window.lucide.createIcons();
        setTimeout(() => {
          btn.className = 'px-5 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition-all cursor-pointer bg-amber-500 hover:bg-amber-400 text-stone-950';
          btn.innerHTML = '<i data-lucide="copy" class="w-4 h-4"></i><span>鑑定結果をコピーする</span>';
          if (window.lucide) window.lucide.createIcons();
        }, 2500);
      }
    };

    // イベントリスナー登録
    document.getElementById('astro-form').addEventListener('submit', function(e) {
      e.preventDefault();
      runDiagnosis(true);
    });

    ['mom-date', 'mom-time', 'child-date', 'child-time'].forEach(id => {
      document.getElementById(id).addEventListener('change', () => runDiagnosis(false));
    });

    // 初回描画
    window.addEventListener('DOMContentLoaded', () => {
      runDiagnosis(false);
    });

// 鍵が正しい時だけ script.js を読み込む
  if (localStorage.getItem("app_unlocked_status") === "neroli") { // ←ここも設定した鍵と同じにする
    const s = document.createElement("script");
    s.src = "script.js";
    document.body.appendChild(s);
  }


  </script>
